    <mask id="gap">
      <rect width="24" height="24" fill="#fff"/>
      <path d="M17.4 3.6C17.5 2.2 18.6 1.2 19.9 1.2S22.4 2.2 22.4 3.5C22.4 4.6 21.6 5.4 20.6 6.2L17.4 8.6H22.6" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <path d="M5 13A7 7 0 0 1 19 13Z" fill="#000" mask="url(#gap)"/>
  <path d="M4 17H14" fill="none" stroke="#000" stroke-width="2.3" stroke-linecap="round"/>
  <path d="M10 20.5H20" fill="none" stroke="#000" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M17.4 3.6C17.5 2.2 18.6 1.2 19.9 1.2S22.4 2.2 22.4 3.5C22.4 4.6 21.6 5.4 20.6 6.2L17.4 8.6H22.6" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
