<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- V1's sun over the waves, with a "2" in the top-right corner. The mask
       carves a gap around the 2 so it stays readable where it meets the sun. -->
