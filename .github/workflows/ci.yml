name: CI

# Runs on every pull request, including those opened from forks, and on the two
# long-lived branches. Nothing here reads a secret: a fork's pull request gets a
# read-only token, and a workflow that needed more would simply never run for
# outside contributors — which is the opposite of what a public repository wants.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main, dev]

# A new push to the same branch makes the previous run pointless.
#
# Keyed on the pull request number when there is one, not on `github.ref` alone:
# the run for a merged pull request's `closed` event gets the BASE branch as its
# ref (`refs/heads/dev`), so it landed in the same group as the push that the
# merge itself makes to `dev`, and cancelled it a second after it started. The
# promotion pull request then showed that cancelled run as its only check.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: github.event.action != 'closed'
    # macOS, not Linux, because that is where this extension actually runs: the
    # hook bridges are zsh scripts, chimes go through `afplay`, and the usage
    # token is read from the system keychain. A Linux runner would be cheaper
    # and greener, and it would also be testing something nobody ships.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `--frozen-lockfile` is the point of running this at all: it fails when
      # the lockfile and package.json disagree, which is exactly the drift a
      # local install would paper over.
      - run: pnpm install --frozen-lockfile

      # Types first: a type error explains itself, a failing test that stems
      # from one does not.
      - run: pnpm typecheck

      - run: pnpm test

      # Packaging is part of the contract, not a release-time afterthought:
      # `vsce` runs `vscode:prepublish`, so this also proves the packaged code
      # is the code in this commit rather than a stale build.
      - run: pnpm package

  # A pull request branch has no reason to outlive its merge. GitHub can do this
  # natively, but the setting also deletes `dev` when `dev` merges into `main`, and
  # making `dev` undeletable is a paid feature on private repositories — hence this
  # job and its explicit list of long-lived branches.
  delete-merged-branch:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && github.event.pull_request.head.repo.full_name == github.repository
      && !contains(fromJSON('["dev","main","master"]'), github.event.pull_request.head.ref)
    # Linux, unlike `check` above: this one only talks to the API, and a macOS
    # runner bills ten times the minutes to do it.
    runs-on: ubuntu-latest
    # Narrower than the workflow-wide `contents: read`, and only for this job.
    permissions:
      contents: write
    steps:
      - name: Delete the head branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Through the environment, never interpolated into `run`: a branch name
          # is a string somebody else gets to choose.
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH"; then
            echo "Deleted $BRANCH."
          else
            echo "Left $BRANCH alone (already gone, or protected)."
          fi
