name: CD

# La livraison de ce dépôt : ce qui arrive sur `main` devient une version.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  version-check:
    # La livraison pose « patch » par défaut quand la ligne manque. Ce n'est pas une
    # raison de la laisser manquer : le niveau se décide ici, à l'ouverture, quand on
    # sait ce qu'on livre. Ce job avertit, il ne bloque pas.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # Tout l'historique : l'étape suivante compare le manifeste de la PR à celui
      # de la base, ce qui demande la branche de base, pas seulement la tête.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: La PR annonce-t-elle son niveau de version ?
        id: niveau
        # Le corps passe par l'environnement, jamais interpolé dans le script :
        # `${{ }}` en plein `run` exécuterait ce qu'un corps de PR contient.
        env:
          CORPS: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          NIVEAU=$(printf '%s\n' "${CORPS:-}" | tr -d '\r' \
                   | grep -iE '^[[:space:]]*Version:[[:space:]]*(major|minor|patch)' | head -1 \
                   | sed -E 's/^[[:space:]]*[Vv]ersion:[[:space:]]*//' | awk '{print tolower($1)}' || true)
          if [ -n "$NIVEAU" ]; then
            echo "Niveau annoncé : **$NIVEAU**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Cette PR n'annonce pas son niveau de version. Ajoute « Version: major|minor|patch » au corps, sinon la livraison posera un patch."
            {
              echo "### Version non annoncée"
              echo
              echo "Ajoute une ligne \`Version: major|minor|patch\` au corps de la PR."
              echo "Sans elle, la livraison sur \`main\` posera un **patch** par défaut."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "niveau=${NIVEAU:-}" >> "$GITHUB_OUTPUT"

      # `package.json` fait foi (CLAUDE.md) et `main` est protégée : le numéro ne
      # peut être posé QUE dans cette PR, avant le merge. Personne ne pourra le
      # rattraper après — d'où ce contrôle ici, au seul moment où c'est encore
      # possible. Il avertit, il ne bloque pas : la livraison sait retomber sur le
      # niveau annoncé, et un merge refusé pour un numéro coûte plus cher qu'il ne
      # rapporte.
      - name: Le numéro de version a-t-il été posé ?
        env:
          NIVEAU: ${{ steps.niveau.outputs.niveau }}
        run: |
          set -euo pipefail
          lire() { node -pe "JSON.parse(require('node:fs').readFileSync(0,'utf8')).version"; }
          APRES=$(lire < package.json)
          AVANT=$(git show "origin/${{ github.base_ref }}:package.json" | lire)

          if [ "$AVANT" = "$APRES" ]; then
            echo "::warning::package.json est resté à $AVANT. Lance « scripts/set-version.sh ${NIVEAU:-patch} », commit, et repousse — sinon la livraison posera le numéro d'office et le manifeste restera faux."
            {
              echo "### Numéro de version non posé"
              echo
              echo "\`package.json\` porte toujours **$AVANT**, la version déjà livrée."
              echo
              echo '```bash'
              echo "scripts/set-version.sh ${NIVEAU:-patch}"
              echo '```'
              echo
              echo "\`main\` est protégée : la livraison ne peut pas écrire dans le dépôt."
              echo "Ce que cette PR ne pose pas, personne ne le posera après elle."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Le saut réellement effectué, comparé à celui annoncé : deux façons de
          # dire la même chose, et c'est justement quand elles divergent qu'il faut
          # le savoir — le corps de la PR sert de source au CHANGELOG et à la Release.
          SAUT=$(node -e '
            const [a, b] = process.argv.slice(1).map((v) => v.split(".").map(Number));
            const lisible = [a, b].every((n) => n.length === 3 && !n.some(Number.isNaN));
            console.log(
              !lisible ? "illisible"
              : b[0] > a[0] ? "major"
              : b[1] > a[1] ? "minor"
              : b[2] > a[2] ? "patch"
              : "arrière",
            );
          ' "$AVANT" "$APRES")

          echo "Version : **$AVANT → $APRES** (\`$SAUT\`)" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${NIVEAU:-}" ] && [ "$SAUT" != "$NIVEAU" ]; then
            echo "::warning::Le corps annonce « $NIVEAU » mais package.json fait un saut « $SAUT » ($AVANT → $APRES). Le tag suivra package.json ; c'est le texte de la Release qui sera faux."
          fi

  version:
    # Poser la version était la dernière marche du processus, et la seule restée
    # manuelle : elle a sauté trois fois sur trois le 13/08.
    #
    # Ce dépôt n'a pas de suite de tests en CI : la livraison n'a donc rien à
    # attendre avant de poser la version. Le jour où une CI arrive ici, ce job
    # prend un `needs` sur elle — un tag posé sur du rouge annoncerait une
    # version qui n'est pas livrable.
    # Le commit de CHANGELOG que ce job pousse lui-même ne doit pas le relancer.
    # Sur le préfixe, pas sur le message entier : la première version de cette garde
    # cherchait un marqueur n'importe où, et a sauté le commit qui l'introduisait.
    #
    # Ce n'est qu'une économie de run : la vraie sécurité est plus bas, un commit
    # poussé directement sur main n'ayant aucune PR associée, il ne bumpe rien.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && !startsWith(github.event.head_commit.message, 'chore(version):')
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag, Release, et push de l'entrée de CHANGELOG
      pull-requests: write # label vX.Y.Z sur la PR livrée
      issues: write # les milestones passent par l'API issues
    # Deux merges rapprochés poseraient deux tags à partir du même « dernier tag ».
    concurrency:
      group: version-${{ github.ref }}
      cancel-in-progress: false
    # Vide quand rien n'a été versionné — un commit direct sur main, sans PR. Le job
    # « publish » s'en sert comme condition : pas de tag, rien à publier.
    outputs:
      tag: ${{ steps.poser.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Le script déduit le prochain numéro du dernier tag existant. Sans
          # l'historique complet ni les tags, il repartirait de 0.0.0.
          fetch-depth: 0

      - name: Retrouver la PR de ce merge
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NUM=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
                  --jq '[.[] | select(.merged_at != null)] | .[0].number // empty' 2>/dev/null || true)
          if [ -z "$NUM" ]; then
            # Un commit poussé directement sur main ne bumpe pas : il est livré avec
            # la PR suivante et cité sous « Commits directs » dans son entrée.
            echo "Aucune PR mergée associée à ${{ github.sha }} — rien à versionner."
          else
            echo "PR #$NUM"
          fi
          echo "numero=$NUM" >> "$GITHUB_OUTPUT"

      - name: Poser la version
        id: poser
        if: steps.pr.outputs.numero != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Niveau laissé vide : le script le lit dans le corps de la PR, retombe sur
          # « patch » si la ligne manque, et n'échoue que si elle est illisible.
          scripts/bump-version.sh "" "${{ steps.pr.outputs.numero }}"

      # `main` est protégée : aucun push direct n'y est admis, et le jeton de ce
      # job n'a pas de dérogation — GitHub réserve celle-ci aux dépôts d'une
      # organisation. Un refus de push n'est donc pas une panne, c'est la règle
      # qui s'applique. Le tag et la Release, eux, sont déjà posés et portent le
      # même texte : la version est livrée quoi qu'il arrive ici, et le
      # mainteneur n'a plus qu'à reporter l'entrée par une PR.
      - name: Publier l'entrée de CHANGELOG
        if: steps.pr.outputs.numero != ''
        run: |
          set -euo pipefail
          if git diff --quiet CHANGELOG.md; then
            echo "Le tag et la Release sont posés, mais CHANGELOG.md n'a pas bougé." >&2
            exit 1
          fi
          git add CHANGELOG.md
          git commit -m "chore(version): entrée de CHANGELOG pour la PR #${{ steps.pr.outputs.numero }}"
          if git push; then
            echo "Entrée de CHANGELOG poussée sur main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning::main est protégée : l'entrée de CHANGELOG n'a pas pu être poussée. Le tag et la Release la portent déjà ; reporte-la par une PR."
          {
            echo "### Entrée de CHANGELOG à reporter"
            echo
            echo "Le tag et la Release sont posés. Seul le fichier n'a pas pu être mis à jour :"
            echo "\`main\` refuse les push directs, et le jeton d'Actions n'a pas de dérogation."
            echo
            echo '```diff'
            git show --format= --no-color HEAD -- CHANGELOG.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    # La publication vit dans le MÊME run que la version, et pas dans un workflow
    # déclenché par le tag ou par la Release. Ce n'est pas un choix de style :
    # GitHub coupe la récursion à la source, et un événement créé avec le jeton
    # d'Actions ne déclenche aucun workflow. Un « on: release: [published] » ou un
    # « on: push: tags: [v*] » ne partirait donc jamais — et il ne le dirait pas,
    # il ne se passerait simplement rien, version après version.
    needs: version
    # Vide quand le job précédent n'a rien versionné : un commit poussé directement
    # sur main n'a pas de PR, donc pas de tag, donc rien à publier.
    if: needs.version.outputs.tag != ''
    # Linux, pas macOS : empaqueter ne dépend pas de la plateforme, et les tests qui
    # en dépendent, eux, ont déjà tourné sur la PR. Un runner macOS facturerait dix
    # fois les minutes pour le même .vsix.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Le tag fait foi sur le numéro livré ; package.json fait foi sur celui que
      # vsce publiera. Ils divergent dans un cas précis et déjà prévu : la PR de
      # promotion a oublié le bump, et bump-version.sh a appliqué le niveau d'office.
      # Sans ce contrôle, vsce partirait publier un numéro déjà en ligne et
      # échouerait sur un message de la place de marché, qui ne dit rien du vrai
      # problème. Celui-ci le dit.
      - name: Le manifeste et le tag disent-ils la même chose ?
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          MANIFESTE=$(node -p "require('./package.json').version")
          if [ "v$MANIFESTE" != "$TAG" ]; then
            echo "::error::$TAG a été posée, mais package.json porte $MANIFESTE — rien n'est publié. Reporte le numéro dans package.json par une PR, puis publie à la main : « npx vsce publish --no-dependencies »."
            exit 1
          fi
          echo "Publication de **$TAG**." >> "$GITHUB_STEP_SUMMARY"

      # « --no-dependencies » parce que le dépôt est en pnpm : sans lui, vsce part
      # sur un « npm ls » qui échoue. C'est sans risque ici, l'extension n'ayant
      # aucune dépendance d'exécution — tout ce qu'elle embarque est dans out/, et
      # .vscodeignore est une liste blanche.
      #
      # vsce lance « vscode:prepublish », donc compile : ce qui part sur la place de
      # marché est le code de ce commit, pas un out/ resté d'un run précédent.
      - name: Publier sur la place de marché
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::error::Le secret VSCE_PAT manque. Crée un jeton Azure DevOps (Marketplace → Manage, « All accessible organizations »), pose-le en secret du dépôt sous ce nom, et relance ce job."
            exit 1
          fi
          pnpm exec vsce publish --no-dependencies

      # Le PAT Azure DevOps expire au bout d'un an au maximum, et son expiration ne
      # se voit nulle part avant la livraison qu'elle bloque. Le tag et la Release
      # sont déjà posés à ce stade : la version existe, elle n'est simplement pas en
      # ligne, et c'est cette phrase-là qu'il faut retrouver dans le run.
      - name: Ce qui reste à faire si la publication a échoué
        if: failure()
        run: |
          {
            echo "### La version est posée, mais pas publiée"
            echo
            echo "Le tag et la Release existent. Seule la place de marché n'a rien reçu."
            echo
            echo "Vérifie d'abord que \`VSCE_PAT\` n'a pas expiré — un jeton Azure DevOps"
            echo "vit un an au plus. Puis, depuis une copie à jour de \`main\` :"
            echo
            echo '```bash'
            echo "pnpm install --frozen-lockfile"
            echo "npx vsce publish --no-dependencies"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
