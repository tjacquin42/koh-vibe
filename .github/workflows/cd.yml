name: CD

# This repository's delivery: what lands on `main` becomes a version.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  version-check:
    # The delivery sets "patch" by default when the line is missing. That is
    # not a reason to leave it missing: the level gets decided here, at
    # opening time, when we know what we are shipping. This job warns, it
    # does not block.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # Full history: the next step compares the PR's manifest to the base
      # branch's, which needs the base branch, not just the head.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does the PR announce its version level?
        id: niveau
        # The body passes through the environment, never interpolated into the
        # script: `${{ }}` right inside `run` would execute whatever a PR body
        # contains.
        env:
          CORPS: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          NIVEAU=$(printf '%s\n' "${CORPS:-}" | tr -d '\r' \
                   | grep -iE '^[[:space:]]*Version:[[:space:]]*(major|minor|patch)' | head -1 \
                   | sed -E 's/^[[:space:]]*[Vv]ersion:[[:space:]]*//' | awk '{print tolower($1)}' || true)
          if [ -n "$NIVEAU" ]; then
            echo "Niveau annoncé : **$NIVEAU**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Cette PR n'annonce pas son niveau de version. Ajoute « Version: major|minor|patch » au corps, sinon la livraison posera un patch."
            {
              echo "### Version non annoncée"
              echo
              echo "Ajoute une ligne \`Version: major|minor|patch\` au corps de la PR."
              echo "Sans elle, la livraison sur \`main\` posera un **patch** par défaut."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "niveau=${NIVEAU:-}" >> "$GITHUB_OUTPUT"

      # `package.json` is the source of truth (CLAUDE.md) and `main` is
      # protected: the number can be set ONLY in this PR, before the merge.
      # Nobody will be able to catch it up afterwards — hence this check here,
      # at the only moment it is still possible. It warns, it does not block:
      # the delivery knows how to fall back to the announced level, and a
      # merge refused over a number costs more than it earns.
      - name: Was the version number set?
        env:
          NIVEAU: ${{ steps.niveau.outputs.niveau }}
        run: |
          set -euo pipefail
          lire() { node -pe "JSON.parse(require('node:fs').readFileSync(0,'utf8')).version"; }
          APRES=$(lire < package.json)
          AVANT=$(git show "origin/${{ github.base_ref }}:package.json" | lire)

          if [ "$AVANT" = "$APRES" ]; then
            echo "::warning::package.json est resté à $AVANT. Lance « scripts/set-version.sh ${NIVEAU:-patch} », commit, et repousse — sinon la livraison posera le numéro d'office et le manifeste restera faux."
            {
              echo "### Numéro de version non posé"
              echo
              echo "\`package.json\` porte toujours **$AVANT**, la version déjà livrée."
              echo
              echo '```bash'
              echo "scripts/set-version.sh ${NIVEAU:-patch}"
              echo '```'
              echo
              echo "\`main\` est protégée : la livraison ne peut pas écrire dans le dépôt."
              echo "Ce que cette PR ne pose pas, personne ne le posera après elle."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The jump actually made, compared to the one announced: two ways of
          # saying the same thing, and it is precisely when they diverge that
          # it needs to be known — the PR body is the source for the
          # CHANGELOG and the Release.
          SAUT=$(node -e '
            const [a, b] = process.argv.slice(1).map((v) => v.split(".").map(Number));
            const lisible = [a, b].every((n) => n.length === 3 && !n.some(Number.isNaN));
            console.log(
              !lisible ? "illisible"
              : b[0] > a[0] ? "major"
              : b[1] > a[1] ? "minor"
              : b[2] > a[2] ? "patch"
              : "arrière",
            );
          ' "$AVANT" "$APRES")

          echo "Version : **$AVANT → $APRES** (\`$SAUT\`)" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${NIVEAU:-}" ] && [ "$SAUT" != "$NIVEAU" ]; then
            echo "::warning::Le corps annonce « $NIVEAU » mais package.json fait un saut « $SAUT » ($AVANT → $APRES). Le tag suivra package.json ; c'est le texte de la Release qui sera faux."
          fi

  version:
    # Setting the version used to be the last step of the process, and the
    # only one left manual: it got skipped three times out of three on 13
    # August.
    #
    # This repository has no CI test suite: the delivery therefore has
    # nothing to wait for before setting the version. The day a CI arrives
    # here, this job takes a `needs` on it — a tag set on red would announce
    # a version that is not shippable.
    # The CHANGELOG commit that this job pushes itself must not re-trigger
    # it. On the prefix, not on the whole message: the first version of this
    # guard looked for a marker anywhere, and skipped the very commit that
    # introduced it.
    #
    # This is only a run-time saving: the real safeguard is further down — a
    # commit pushed directly to main, having no associated PR, bumps nothing.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && !startsWith(github.event.head_commit.message, 'chore(version):')
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag, Release, and pushing the CHANGELOG entry
      pull-requests: write # vX.Y.Z label on the shipped PR
      issues: write # milestones go through the issues API
    # Two merges close together would set two tags from the same "last tag".
    concurrency:
      group: version-${{ github.ref }}
      cancel-in-progress: false
    # Empty when nothing was versioned — a commit pushed directly to main,
    # with no PR. The "publish" job uses this as its condition: no tag,
    # nothing to publish.
    outputs:
      tag: ${{ steps.poser.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The script derives the next number from the last existing tag.
          # Without the full history or the tags, it would start over from
          # 0.0.0.
          fetch-depth: 0

      - name: Find the PR of this merge
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NUM=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
                  --jq '[.[] | select(.merged_at != null)] | .[0].number // empty' 2>/dev/null || true)
          if [ -z "$NUM" ]; then
            # A commit pushed directly to main does not bump: it ships with
            # the next PR and is cited under "Direct commits" in its entry.
            echo "Aucune PR mergée associée à ${{ github.sha }} — rien à versionner."
          else
            echo "PR #$NUM"
          fi
          echo "numero=$NUM" >> "$GITHUB_OUTPUT"

      - name: Set the version
        id: poser
        if: steps.pr.outputs.numero != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Level left empty: the script reads it from the PR body, falls
          # back to "patch" if the line is missing, and only fails if it is
          # unreadable.
          scripts/bump-version.sh "" "${{ steps.pr.outputs.numero }}"

      # `main` is protected: no direct push is allowed there, and this job's
      # token has no bypass — GitHub reserves that for organisation
      # repositories. A push refusal is therefore not a failure, it is the
      # rule applying. The tag and the Release, meanwhile, are already set and
      # carry the same text: the version is shipped no matter what happens
      # here, and the maintainer only has to carry the entry over in a PR.
      # The file does not move when the promotion PR wrote its entry itself,
      # which is the nominal case: it is the only place from which it can
      # reach the repository. There is then nothing to commit, and above all
      # nothing to flag — a delivery has no business complaining about work
      # correctly done upstream.
      #
      # The rest of this step is the safety net: bump-version.sh had to
      # insert a bare heading for lack of an entry, it has already warned,
      # and this heading will not be pushable.
      - name: Publish the CHANGELOG entry
        if: steps.pr.outputs.numero != ''
        run: |
          set -euo pipefail
          if git diff --quiet CHANGELOG.md; then
            echo "L'entrée de CHANGELOG était déjà écrite : la PR de promotion l'a portée." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git add CHANGELOG.md
          git commit -m "chore(version): entrée de CHANGELOG pour la PR #${{ steps.pr.outputs.numero }}"
          if git push; then
            echo "Entrée de CHANGELOG poussée sur main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning::main est protégée : l'entrée de CHANGELOG n'a pas pu être poussée. Le tag et la Release la portent déjà ; reporte-la par une PR."
          {
            echo "### Entrée de CHANGELOG à reporter"
            echo
            echo "Le tag et la Release sont posés. Seul le fichier n'a pas pu être mis à jour :"
            echo "\`main\` refuse les push directs, et le jeton d'Actions n'a pas de dérogation."
            echo
            echo '```diff'
            git show --format= --no-color HEAD -- CHANGELOG.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    # The publication lives in the SAME run as the version, not in a workflow
    # triggered by the tag or by the Release. This is not a matter of style:
    # GitHub cuts the recursion at the source, and an event created with the
    # Actions token triggers no workflow. An "on: release: [published]" or an
    # "on: push: tags: [v*]" would therefore never start — and it would not
    # say so, nothing would simply happen, version after version.
    needs: version
    # Empty when the previous job did not version anything: a commit pushed
    # directly to main has no PR, hence no tag, hence nothing to publish.
    if: needs.version.outputs.tag != ''
    # Linux, not macOS: packaging does not depend on the platform, and the
    # tests that do depend on it have already run on the PR. A macOS runner
    # would bill ten times the minutes for the same .vsix.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The tag is the source of truth for the shipped number; package.json
      # is the source of truth for the one both places will receive. They
      # diverge in one specific, already anticipated case: the promotion PR
      # forgot the bump, and bump-version.sh applied the level on its own.
      # Without this check, the publication would go out on a number already
      # live and would fail on a registry message that says nothing about
      # the real problem. This one says it.
      - name: Do the manifest and the tag agree?
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          MANIFESTE=$(node -p "require('./package.json').version")
          if [ "v$MANIFESTE" != "$TAG" ]; then
            echo "::error::$TAG a été posée, mais package.json porte $MANIFESTE — rien n'est publié. Reporte le numéro dans package.json par une PR, puis publie à la main : « npx vsce publish --no-dependencies » et « npx ovsx publish »."
            exit 1
          fi
          echo "Publication de **$TAG**." >> "$GITHUB_STEP_SUMMARY"

      # A single packaging step for both places: it is the same .vsix, byte
      # for byte, that goes out to one and to the other. Publishing twice
      # from source would rebuild two — identical in principle, but nothing
      # guarantees it, and a divergence between the two registries would
      # only show up once installed at someone's place.
      #
      # "--no-dependencies" because the repository is on pnpm: without it,
      # vsce goes for an "npm ls" that fails. That is safe here, the
      # extension having no runtime dependency at all — everything it
      # carries is in out/, and .vscodeignore is an allowlist.
      #
      # vsce runs "vscode:prepublish", so it compiles: what gets packaged is
      # the code of this commit, not an out/ left over from a previous run.
      - name: Package, once for both registries
        id: paquet
        run: |
          set -euo pipefail
          VSIX="koh-vibe-$(node -p "require('./package.json').version").vsix"
          pnpm exec vsce package --no-dependencies --out "$VSIX"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      # With no token, this step is skipped rather than failing. That is a
      # choice, not an oversight: publishing to the marketplace is done by
      # hand, by uploading the .vsix, and Azure DevOps's global PATs
      # disappear on 1 December 2026 — setting up a token today only to
      # replace it in three months with a federated identity is not worth
      # the organisation it takes to open to get one.
      #
      # Failing here would make the delivery red at EVERY version, for an
      # absence that was chosen. A pipeline that is red all the time is a
      # pipeline nobody reads any more, and that is how a real failure slips
      # through unnoticed. The job therefore stays green and the summary
      # carries the upload still to do.
      - name: Publish to the registries
        id: marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX: ${{ steps.paquet.outputs.vsix }}
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "publie=non" >> "$GITHUB_OUTPUT"
            echo "::warning::Pas de VSCE_PAT : la place de marché n'a rien reçu. Téléverse $VSIX à la main sur marketplace.visualstudio.com/manage/publishers/tjacquin42 — Open VSX, lui, est publié."
            {
              echo "### Reste à téléverser sur la place de marché"
              echo
              echo "Open VSX a reçu cette version. La place de marché de Microsoft attend un"
              echo "téléversement manuel de \`$VSIX\`, récupérable dans les artefacts de ce run :"
              echo
              echo "<https://marketplace.visualstudio.com/manage/publishers/tjacquin42>"
              echo
              echo "Pour automatiser cette moitié, il faut un \`VSCE_PAT\` — voir CLAUDE.md."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "publie=oui" >> "$GITHUB_OUTPUT"
          pnpm exec vsce publish --no-dependencies --packagePath "$VSIX"

      # The .vsix survives the run: it is the one to upload by hand as long
      # as the marketplace is not automated, and it is also the only copy of
      # the package actually published on Open VSX.
      - name: Keep the run's package
        if: ${{ !cancelled() && steps.paquet.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.paquet.outputs.vsix }}
          path: ${{ steps.paquet.outputs.vsix }}
          retention-days: 90

      # Open VSX is the forks' place: Cursor, Windsurf, VSCodium and
      # Antigravity cannot reach Microsoft's, and those are the editors this
      # extension is actually used in. Without this step, half the public
      # would have no path other than building the package themselves.
      #
      # "!cancelled()" rather than the previous step's success: a failure of
      # one registry must not deprive the other of its version. The job
      # stays red, and the summary below says which of the two places
      # received what. The only condition kept is the packaging: with no
      # .vsix, there is nothing to send.
      - name: Publish to Open VSX
        id: openvsx
        if: ${{ !cancelled() && steps.paquet.outcome == 'success' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX: ${{ steps.paquet.outputs.vsix }}
        run: |
          set -euo pipefail
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::error::Le secret OVSX_PAT manque. Crée un jeton sur open-vsx.org (Profile → Access Tokens), pose-le en secret du dépôt sous ce nom, et relance ce job."
            exit 1
          fi
          pnpm exec ovsx publish "$VSIX"

      # Both tokens expire, and their expiry shows up nowhere before the
      # delivery it blocks — one year at most for Azure DevOps's. The tag and
      # the Release are already set at this point: the version exists, it is
      # simply not live everywhere, and this table is what needs to be found
      # in the run rather than a failure with no lead.
      - name: What is left to do when publishing failed
        if: failure()
        env:
          TAG: ${{ needs.version.outputs.tag }}
          MARKETPLACE: ${{ steps.marketplace.outcome }}
          MARKETPLACE_PUBLIE: ${{ steps.marketplace.outputs.publie }}
          OPENVSX: ${{ steps.openvsx.outcome }}
        run: |
          etat() { case "${1:-}" in success) echo "en ligne" ;; failure) echo "**échec**" ;; *) echo "non tentée" ;; esac; }
          # A step skipped for lack of a token is "success": without this
          # fix, the table would announce as live a version nobody uploaded.
          if [ "${MARKETPLACE_PUBLIE:-}" = "non" ]; then MARKETPLACE=sautee; fi
          etat_marketplace() { if [ "$MARKETPLACE" = "sautee" ]; then echo "sautée — téléversement manuel"; else etat "$MARKETPLACE"; fi; }
          NUMERO="${TAG#v}"
          {
            echo "### $TAG est posée, mais pas publiée partout"
            echo
            echo "Le tag et la Release existent : la version est livrée. Reste à savoir où elle est arrivée."
            echo
            echo "| Place | État |"
            echo "|---|---|"
            echo "| Place de marché VSCode | $(etat_marketplace) |"
            echo "| Open VSX | $(etat "${OPENVSX:-}") |"
            echo
            echo "Vérifie d'abord que le jeton correspondant n'a pas expiré."
            echo "Puis, depuis une copie à jour de \`main\`, ne relance que la place manquante :"
            echo
            echo '```bash'
            echo "pnpm install --frozen-lockfile"
            echo "pnpm exec vsce package --no-dependencies --out koh-vibe-$NUMERO.vsix"
            echo "npx vsce publish --no-dependencies --packagePath koh-vibe-$NUMERO.vsix   # place de marché"
            echo "npx ovsx publish koh-vibe-$NUMERO.vsix                                   # Open VSX"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
